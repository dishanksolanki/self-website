name: Update Portfolio

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project Name'
        required: true
      project_description:
        description: 'What did you build?'
        required: true
      project_link:
        description: 'Project Link (optional)'
        required: false
      project_tags:
        description: 'Tags separated by comma (e.g. Python,AI,Flask)'
        required: true

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call Gemini AI
        id: gemini
        run: |
          RESPONSE=$(curl -s -X POST \
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"contents\":[{
              \"parts\":[{
                \"text\": \"Write one short 2 sentence description for a project called ${{ inputs.project_name }} for a BTech CSE student portfolio.\"
              }]
            }]
          }")
          echo "Gemini Response: $RESPONSE"
          DESC=$(echo $RESPONSE | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if 'candidates' in data:
              print(data['candidates'][0]['content']['parts'][0]['text'].strip())
          else:
              print('${{ inputs.project_description }}')
          ")
          echo "desc<<EOF" >> $GITHUB_OUTPUT
          echo "$DESC" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update index.html
        run: |
          COUNT=$(grep -o 'proj-card' index.html | wc -l)
          NEW_IDX=$(printf "%02d" $((COUNT + 1)))
          
          TAGS=""
          IFS=',' read -ra TAG_LIST <<< "${{ inputs.project_tags }}"
          for tag in "${TAG_LIST[@]}"; do
            tag=$(echo $tag | xargs)
            TAGS="${TAGS}<span class=\"ptag\">${tag}</span>"
          done
          
          LINK="${{ inputs.project_link }}"
          if [ -z "$LINK" ]; then
            LINK="https://github.com/dishanksolanki"
          fi
          
          python3 -c "
          content = open('index.html', encoding='utf-8').read()
          new_card = '      <div class=\"proj-card fade-up\" data-href=\"${LINK}\"><div class=\"proj-idx\">${NEW_IDX}</div><div class=\"proj-name\">${{ inputs.project_name }}</div><p class=\"proj-desc\">${{ steps.gemini.outputs.desc }}</p><div class=\"proj-footer\"><div class=\"proj-tags\">${TAGS}</div></div></div>'
          old = '    </div>\n  </div>\n</section>'
          new = new_card + '\n    </div>\n  </div>\n</section>'
          if old in content:
              content = content.replace(old, new, 1)
              print('SUCCESS: Project card added!')
          else:
              print('ERROR: Pattern not found!')
              exit(1)
          open('index.html', 'w', encoding='utf-8').write(content)
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Add new project: ${{ inputs.project_name }}"
          git push
