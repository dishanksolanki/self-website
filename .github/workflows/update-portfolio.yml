name: Update Portfolio

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project Name'
        required: true
      project_description:
        description: 'What did you build?'
        required: true
      project_link:
        description: 'Project Link (optional)'
        required: false
      project_tags:
        description: 'Tags separated by comma (e.g. Python,AI,Flask)'
        required: true

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call Gemini AI
        id: gemini
        run: |
          RESPONSE=$(curl -s -X POST \
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"contents\":[{
              \"parts\":[{
                \"text\": \"Write one short 2 sentence description for a project called ${{ inputs.project_name }} for a BTech CSE student portfolio.\"
              }]
            }]
          }")
          echo "Gemini Response: $RESPONSE"
          DESC=$(echo $RESPONSE | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if 'candidates' in data:
              print(data['candidates'][0]['content']['parts'][0]['text'].strip())
          else:
              print('${{ inputs.project_description }}')
          ")
          echo "desc<<EOF" >> $GITHUB_OUTPUT
          echo "$DESC" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update index.html
        run: |
          COUNT=$(grep -o 'proj-card' index.html | wc -l)
          NEW_IDX=$(printf "%02d" $((COUNT + 1)))
          
          TAGS=""
          IFS=',' read -ra TAG_LIST <<< "${{ inputs.project_tags }}"
          for tag in "${TAG_LIST[@]}"; do
            tag=$(echo $tag | xargs)
            TAGS="${TAGS}<span class=\"ptag\">${tag}</span>"
          done
          
          LINK="${{ inputs.project_link }}"
          if [ -z "$LINK" ]; then
            LINK="https://github.com/dishanksolanki"
          fi

          python3 << 'PYEOF'
          import os
          content = open('index.html', encoding='utf-8').read()
          new_idx = os.environ['NEW_IDX']
          project_name = os.environ['PROJECT_NAME']
          desc = os.environ['DESC']
          tags = os.environ['TAGS']
          link = os.environ['LINK']
          new_card = f'      <div class="proj-card fade-up" data-href="{link}"><div class="proj-idx">{new_idx}</div><div class="proj-name">{project_name}</div><p class="proj-desc">{desc}</p><div class="proj-footer"><div class="proj-tags">{tags}</div></div></div>'
          projects_start = content.find('id="projects"')
          projects_section = content[projects_start:]
          end_idx = projects_section.find('</section>') + len('</section>')
          projects_html = projects_section[:end_idx]
          last_card_end = projects_html.rfind('</div></div>')
          insert_pos = projects_start + last_card_end + len('</div></div>')
          content = content[:insert_pos] + '\n' + new_card + content[insert_pos:]
          open('index.html', 'w', encoding='utf-8').write(content)
          print('SUCCESS!')
          PYEOF
        env:
          NEW_IDX: ${{ env.NEW_IDX }}
          PROJECT_NAME: ${{ inputs.project_name }}
          DESC: ${{ steps.gemini.outputs.desc }}
          TAGS: ${{ env.TAGS }}
          LINK: ${{ inputs.project_link }}

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Add new project: ${{ inputs.project_name }}"
          git push
