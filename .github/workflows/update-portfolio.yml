- name: Call Gemini AI
        id: gemini
        run: |
          RESPONSE=$(curl -s -X POST \
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"contents\":[{
              \"parts\":[{
                \"text\": \"Write one short 2 sentence description for a project called ${{ inputs.project_name }} for a BTech CSE student portfolio.\"
              }]
            }]
          }")
          echo "Gemini Response: $RESPONSE"
          DESC=$(echo $RESPONSE | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if 'candidates' in data:
              print(data['candidates'][0]['content']['parts'][0]['text'].strip())
          else:
              print('${{ inputs.project_description }}')
          ")
          echo "desc<<EOF" >> $GITHUB_OUTPUT
          echo "$DESC" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
