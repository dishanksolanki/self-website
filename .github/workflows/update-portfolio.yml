name: Update Portfolio

on:
  workflow_dispatch:

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Call Gemini AI
        run: |
          curl -s -X POST \
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "contents":[{
              "parts":[{
                "text": "I am Dishank Solanki, a BTech CSE student. Write 2 short professional bullet points to add to my portfolio website projects section for a new project."
              }]
            }]
          }'
